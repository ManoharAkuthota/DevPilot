services:
  # Spring Boot 3 Java 21 Backend Web Service
  - type: web
    name: devpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: singapore
    healthCheckPath: /api/system/metrics
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: tidb
      - key: TIDB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_DATABASE
        value: devpilot_db
      - key: TIDB_USER
        value: 3HVUhdVZBhSBCPs.root
      - key: TIDB_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true

  # React 19 + Vite Static Site Frontend
  - type: web
    name: devpilot-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: singapore
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: devpilot-backend
          property: host
