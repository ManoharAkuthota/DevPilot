services:
  # Spring Boot 3 Java 21 Backend Web Service
  - type: web
    name: devpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/system/metrics
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: tidb
      - key: TIDB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_DATABASE
        value: devpilot_db
      - key: TIDB_USER
        value: 3HVUhdVZBhSBCPs.root
      - key: TIDB_PASSWORD
        value: 6BP74bdgTlFpWzrm
      - key: APP_JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"

  # React 19 + Vite Static Site Frontend
  - type: web
    name: devpilot-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://devpilot-backend.onrender.com
